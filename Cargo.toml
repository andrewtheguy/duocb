[workspace]
members = ["crates/*"]
# duocb-ffi is an iOS staticlib: it only builds for the Apple targets and is
# produced by ./build-ios.sh, never by a plain host build. Excluding it here
# keeps `cargo build`/`clippy`/`test` at the workspace root desktop-only.
default-members = ["crates/duocb", "crates/duocb-core"]
resolver = "3"

[workspace.package]
version = "0.0.34"
edition = "2024"
description = "P2P clipboard sharing between two devices over iroh"

[workspace.dependencies]
duocb-core = { path = "crates/duocb-core" }

# GUI
# FemtoVG avoids Skia's large native build while retaining GPU rendering.
# Slint 1.16+ uses Swash for improved FemtoVG glyph rasterization.
slint = { version = "1.17.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "accessibility",
    "compat-1-2",
] }
slint-build = "1.17.1"
# duocb transfers text only; arboard's default image codecs are unused.
arboard = { version = "3.6.1", default-features = false }

# P2P transport
iroh = "1.0.3"
# Both open multicast sockets in-process, so both are pulled in only on
# non-iOS targets (see crates/duocb-core/Cargo.toml for why).
iroh-mdns-address-lookup = "0.4.0"
# Spec-compliant DNS-SD for the rendezvous records: interoperates with other
# Bonjour implementations on the network. iOS uses the system mDNSResponder
# daemon over dns_sd.h instead.
mdns-sd = "0.20.1"
# iOS only: poll(2) and the sockaddr layouts for the dns_sd.h callbacks.
libc = "0.2"
# Local network-interface enumeration (address + netmask) for constraining the
# LAN-only joiner's typed host IP to its own subnet.
netdev = "0.45"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
futures = { version = "0.3", default-features = false, features = ["std"] }

# Signaling
nostr-sdk = { version = "0.44.1", features = ["nip44"] }
sha2 = "0.10"
argon2 = "0.5.3"
subtle = "2"
base64 = "0.22"
rand = "0.9"

# Async runtime + plumbing
tokio = { version = "1", default-features = false, features = [
    "io-util",
    "macros",
    "net",
    "rt-multi-thread",
    "sync",
    "time",
] }
tokio-util = "0.7"
parking_lot = "0.12"

# Serialization / misc
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
dirs = "6"
jiff = "0.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
# Drops the unwinding tables and landing pads: smaller binary, less codegen.
panic = "abort"
